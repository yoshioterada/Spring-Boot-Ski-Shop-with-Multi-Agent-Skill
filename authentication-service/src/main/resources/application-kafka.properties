# Kafka Event Publishing (Phase 2)
# Activate with: spring.profiles.active=kafka

# Spring Cloud Stream - Kafka Binder
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.replicationFactor=${KAFKA_REPLICATION_FACTOR:3}

# Output Binding
spring.cloud.stream.bindings.domainEvents-out-0.destination=user-events
spring.cloud.stream.bindings.domainEvents-out-0.content-type=application/json

# Producer Settings
spring.cloud.stream.kafka.bindings.domainEvents-out-0.producer.acks=all
spring.cloud.stream.kafka.bindings.domainEvents-out-0.producer.retries=3
spring.cloud.stream.kafka.bindings.domainEvents-out-0.producer.configuration.enable.idempotence=true

# Azure Event Hubs SASL/SSL Configuration
spring.cloud.stream.kafka.binder.configuration.security.protocol=SASL_SSL
spring.cloud.stream.kafka.binder.configuration.sasl.mechanism=PLAIN
spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EVENTHUB_CS}";
