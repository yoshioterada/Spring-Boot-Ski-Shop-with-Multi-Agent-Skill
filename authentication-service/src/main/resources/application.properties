spring.application.name=authentication-service

# Server
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skishop_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=60
jwt.refresh-token-expiration-days=7

# Redis (disabled by default for local dev)
# NOTE: authentication-service currently doesn't use Redis in code, but the dependency is present.
# Without a Redis container, the health check turns the service UNHEALTHY.
management.health.redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# Logging
logging.level.root=WARN
logging.level.com.example.skishop=INFO

# Virtual Threads
spring.threads.virtual.enabled=true

# RFC 7807
spring.mvc.problemdetails.enabled=true

# Pageable
spring.data.web.pageable.max-page-size=100

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.acks=all

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
