spring.application.name=api-gateway-service
server.port=8090

# Gateway global settings
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Service URLs (externalized for deployment)
app.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8080}
app.services.user-url=${USER_SERVICE_URL:http://localhost:8081}
app.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8082}
app.services.sales-url=${SALES_SERVICE_URL:http://localhost:8083}
app.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
app.services.point-url=${POINT_SERVICE_URL:http://localhost:8085}
app.services.coupon-url=${COUPON_SERVICE_URL:http://localhost:8088}
app.services.ai-url=${AI_SERVICE_URL:http://localhost:8087}
app.services.mail-url=${MAIL_SERVICE_URL:http://localhost:8089}

# OAuth2 Resource Server (JWT)
# Note: For local dev we use symmetric JWT (HS256) via jwt.secret.
# If you want JWKS/issuer validation, set JWT_ISSUER_URI / JWT_JWK_SET_URI and remove the custom decoder bean.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:}

# Symmetric JWT secret for local dev (env: JWT_SECRET)
jwt.secret=${JWT_SECRET:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=when-authorized
management.endpoint.gateway.enabled=true
management.endpoint.health.probes.enabled=true

# Redis for rate limiting (disabled by default)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Resilience4j Circuit Breaker - Authentication Service
resilience4j.circuitbreaker.instances.authCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.authCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.authCircuitBreaker.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.authCircuitBreaker.slow-call-duration-threshold=2s

# Resilience4j Circuit Breaker - User Management Service
resilience4j.circuitbreaker.instances.userCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.userCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userCircuitBreaker.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.userCircuitBreaker.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.userCircuitBreaker.slow-call-duration-threshold=3s

# Resilience4j Circuit Breaker - Inventory Management Service
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.slow-call-duration-threshold=5s

# Resilience4j Circuit Breaker - Sales Management Service
resilience4j.circuitbreaker.instances.salesCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.salesCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.salesCircuitBreaker.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.salesCircuitBreaker.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.salesCircuitBreaker.slow-call-duration-threshold=4s

# Resilience4j Circuit Breaker - Payment & Cart Service
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.failure-rate-threshold=30
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.wait-duration-in-open-state=120s
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.slow-call-duration-threshold=10s

# Resilience4j Circuit Breaker - Point Service
resilience4j.circuitbreaker.instances.pointCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.pointCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pointCircuitBreaker.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.pointCircuitBreaker.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.pointCircuitBreaker.slow-call-duration-threshold=3s

# Resilience4j Circuit Breaker - Coupon Service
resilience4j.circuitbreaker.instances.couponCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.couponCircuitBreaker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.couponCircuitBreaker.wait-duration-in-open-state=45s
resilience4j.circuitbreaker.instances.couponCircuitBreaker.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.couponCircuitBreaker.slow-call-duration-threshold=3s

# Resilience4j Circuit Breaker - AI Support Service
resilience4j.circuitbreaker.instances.aiCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiCircuitBreaker.failure-rate-threshold=70
resilience4j.circuitbreaker.instances.aiCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiCircuitBreaker.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.aiCircuitBreaker.slow-call-duration-threshold=5s

# Resilience4j TimeLimiter defaults
resilience4j.timelimiter.instances.authCircuitBreaker.timeout-duration=2s
resilience4j.timelimiter.instances.userCircuitBreaker.timeout-duration=3s
resilience4j.timelimiter.instances.inventoryCircuitBreaker.timeout-duration=5s
resilience4j.timelimiter.instances.salesCircuitBreaker.timeout-duration=4s
resilience4j.timelimiter.instances.paymentCircuitBreaker.timeout-duration=10s
resilience4j.timelimiter.instances.pointCircuitBreaker.timeout-duration=3s
resilience4j.timelimiter.instances.couponCircuitBreaker.timeout-duration=3s
resilience4j.timelimiter.instances.aiCircuitBreaker.timeout-duration=5s

# Request size limit
spring.cloud.gateway.httpclient.response-timeout=10s
spring.codec.max-in-memory-size=5MB

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.skishop.gateway=DEBUG
logging.level.io.github.resilience4j=INFO

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Error configuration
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
