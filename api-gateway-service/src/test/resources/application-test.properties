spring.application.name=api-gateway-service
server.port=0

# Redis disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# Disable OAuth2 JWT in tests (mock JWT decoder is provided)
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Provide dummy secret so SecurityConfig's ReactiveJwtDecoder bean can be instantiated
jwt.secret=test-dummy-secret-for-tests-only

# Circuit breaker disabled for tests
resilience4j.circuitbreaker.configs.default.register-health-indicator=false

# Service URLs for tests
app.services.auth-url=http://localhost:18080
app.services.user-url=http://localhost:18081
app.services.inventory-url=http://localhost:18082
app.services.sales-url=http://localhost:18083
app.services.payment-url=http://localhost:18084
app.services.point-url=http://localhost:18085
app.services.coupon-url=http://localhost:18088
app.services.ai-url=http://localhost:18087
