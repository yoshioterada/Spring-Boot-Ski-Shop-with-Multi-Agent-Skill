spring.application.name=sales-management-service
server.port=8083
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skishop_sales}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# JWT
jwt.secret=${JWT_SECRET}

logging.level.root=WARN
logging.level.com.example.skishop=INFO

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Pageable
# 管理画面ダッシュボードで月別集計する際、過去 2 年分（~30,000 件）を一括取得するため上限を引き上げる
spring.data.web.pageable.max-page-size=50000

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Internal service-to-service auth (Multi-Agent infrastructure)
internal.api-key=${INTERNAL_API_KEY:dev-internal-api-key-please-change-in-prod-1234567890abcdef}

# Downstream services (used by sales analytics for category resolution)
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://inventory-management-service:8082}
