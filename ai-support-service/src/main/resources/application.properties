spring.application.name=ai-support-service
server.port=8087
spring.threads.virtual.enabled=true

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skishop_ai}
spring.data.mongodb.database=skishop_ai

# PostgreSQL (pgvector)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skishop_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Spring AI - Azure OpenAI
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT:gpt-5}
spring.ai.azure.openai.chat.options.temperature=1
spring.ai.azure.openai.chat.options.max-completion-tokens=1500
# AI Analyzer (D-F1-02): gpt-5 系では temperature を変更不可（API が 400 を返す）。
# seed は再現性確保のため固定. 出力長は 1500 トークン上限.
spring.ai.azure.openai.chat.options.seed=42

# Spring AI - Retry / Timeout
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2

# Redis (disabled by default for local dev)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# Pageable
spring.data.web.pageable.max-page-size=100

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# JWT
jwt.secret=${JWT_SECRET}

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Internal service-to-service auth (Multi-Agent infrastructure)
internal.api-key=${INTERNAL_API_KEY:dev-internal-api-key-please-change-in-prod-1234567890abcdef}

# ============================================================
# AI Analyzer (P0) — base configuration
# ============================================================
ai-analyzer.enabled=${AI_ANALYZER_ENABLED:true}
ai-analyzer.cache-ttl-minutes=${AI_ANALYZER_CACHE_TTL_MINUTES:60}
ai-analyzer.max-history-turns=${AI_ANALYZER_MAX_HISTORY_TURNS:8}
ai-analyzer.monthly-cost-limit-usd=${AI_ANALYZER_MONTHLY_COST_LIMIT_USD:30}
ai-analyzer.weekly-summary.cron=${AI_ANALYZER_WEEKLY_CRON:0 0 7 * * MON}
ai-analyzer.weekly-summary.zone=Asia/Tokyo
ai-analyzer.weekly-summary.refresh-rate-limit-minutes=60
ai-analyzer.dead-stock.discount-pct-max=40
ai-analyzer.dead-stock.duplicate-block-days=30
ai-analyzer.dead-stock.elasticity.cat-ski=-1.4
ai-analyzer.dead-stock.elasticity.cat-boots=-1.6
ai-analyzer.dead-stock.elasticity.cat-wear=-2.1
ai-analyzer.dead-stock.elasticity.cat-gloves=-1.8
ai-analyzer.dead-stock.elasticity.cat-goggles=-1.3
ai-analyzer.dead-stock.elasticity.cat-helmets=-1.2
ai-analyzer.dead-stock.elasticity.cat-poles=-1.5
ai-analyzer.dead-stock.elasticity.default=-1.5
ai-analyzer.zero-hit.min-search-count=3
ai-analyzer.zero-hit.dismiss-ttl-days=90
ai-analyzer.zero-hit.conversion-rate=0.05

# Service-to-service base URLs (for WebClient)
service.sales.url=${SERVICE_SALES_URL:http://sales-management-service:8083}
service.user.url=${SERVICE_USER_URL:http://user-management-service:8081}
service.inventory.url=${SERVICE_INVENTORY_URL:http://inventory-management-service:8082}
service.coupon.url=${SERVICE_COUPON_URL:http://coupon-service:8088}
service.weather.url=${SERVICE_WEATHER_URL:http://agent-runtime-monolith:8100}

# ============================================================
# Resilience4j — D-COM-07 (CircuitBreaker / Retry)
# ============================================================
resilience4j.circuitbreaker.instances.azureOpenAi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.azureOpenAi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.azureOpenAi.sliding-window-size=10
resilience4j.circuitbreaker.instances.azureOpenAi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.azureOpenAi.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.salesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.salesService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.salesService.sliding-window-size=10
resilience4j.circuitbreaker.instances.salesService.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.couponService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.couponService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.couponService.sliding-window-size=10
resilience4j.circuitbreaker.instances.couponService.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.weatherService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.weatherService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.weatherService.sliding-window-size=10
resilience4j.circuitbreaker.instances.weatherService.wait-duration-in-open-state=30s

resilience4j.retry.instances.azureOpenAi.max-attempts=3
resilience4j.retry.instances.azureOpenAi.wait-duration=1s
resilience4j.retry.instances.azureOpenAi.exponential-backoff-multiplier=2

resilience4j.retry.instances.serviceCall.max-attempts=2
resilience4j.retry.instances.serviceCall.wait-duration=500ms

