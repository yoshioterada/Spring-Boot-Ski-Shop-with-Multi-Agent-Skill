spring.application.name=inventory-management-service
server.port=8082
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Exclude JPA/DataSource/Flyway (MongoDB-only service)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skishop_inventory}
spring.data.mongodb.auto-index-creation=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Logging
logging.level.root=WARN
logging.level.com.example.skishop=INFO

# Virtual Threads
spring.threads.virtual.enabled=true

# RFC 7807
spring.mvc.problemdetails.enabled=true

# Pageable
spring.data.web.pageable.max-page-size=100

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# JWT
jwt.secret=${JWT_SECRET}

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Internal service-to-service auth (Multi-Agent infrastructure)
internal.api-key=${INTERNAL_API_KEY:dev-internal-api-key-please-change-in-prod-1234567890abcdef}
