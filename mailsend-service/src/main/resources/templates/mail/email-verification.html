<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout/base :: layout(${subject}, ${baseUrl}, ~{::content})}">
<body>
<div th:fragment="content">
    <p><span th:text="${firstName}">お客様</span> 様</p>
    <p>Azure SkiShop のご利用ありがとうございます。以下のリンクからメールアドレスの確認を完了してください。</p>
    <p>
        <a th:href="${verifyUrl}" style="display:inline-block;padding:10px 16px;background-color:#0b5cab;color:#ffffff;text-decoration:none;border-radius:6px;">
            メールアドレスを確認する
        </a>
    </p>
    <p style="font-size:12px;color:#6b7280;">このリンクに心当たりがない場合は、本メールを破棄してください。</p>
</div>
</body>
</html>
