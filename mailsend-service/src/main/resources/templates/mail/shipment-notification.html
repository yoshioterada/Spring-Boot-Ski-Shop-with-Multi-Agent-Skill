<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout/base :: layout(${subject}, ${baseUrl}, ~{::content})}">
<body>
<div th:fragment="content">
    <p><span th:text="${recipientName}">お客様</span> 様</p>
    <p>ご注文商品を発送しました。</p>
    <p>注文番号: <span th:text="${orderNumber}">ORD-XXXX</span></p>
    <p>配送会社: <span th:text="${carrier}">Carrier</span></p>
    <p>追跡番号: <span th:text="${trackingNumber}">0000</span></p>
</div>
</body>
</html>
