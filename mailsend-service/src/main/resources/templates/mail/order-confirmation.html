<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout/base :: layout(${subject}, ${baseUrl}, ~{::content})}">
<body>
<div th:fragment="content">
    <p><span th:text="${recipientName}">お客様</span> 様</p>
    <p>ご注文ありがとうございます。注文番号は以下です。</p>
    <p style="font-size:16px;font-weight:bold;" th:text="${orderNumber}">ORD-XXXX</p>
    <p>合計金額: <span th:text="${totalAmount}">0</span></p>
</div>
</body>
</html>
