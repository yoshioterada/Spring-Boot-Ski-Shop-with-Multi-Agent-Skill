<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout/base :: layout(${subject}, ${baseUrl}, ~{::content})}">
<body>
<div th:fragment="content">
    <p><span th:text="${firstName}">お客様</span> 様</p>
    <p>パスワード再設定のリクエストを受け付けました。以下のリンクから再設定を行ってください。</p>
    <p>
        <a th:href="${resetUrl}" style="display:inline-block;padding:10px 16px;background-color:#0b5cab;color:#ffffff;text-decoration:none;border-radius:6px;">
            パスワードを再設定する
        </a>
    </p>
    <p style="font-size:12px;color:#6b7280;">このリンクは一定時間で期限切れになります。</p>
</div>
</body>
</html>
