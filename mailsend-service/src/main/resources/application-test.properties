# Test profile
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=test-secret-key-for-testing-only-minimum-256-bits-required-here-padding

# Kafka test binder
spring.cloud.stream.kafka.binder.brokers=ignored

# Azure (dummy)
azure.communication.endpoint=https://example.invalid
azure.communication.connection-string=
azure.communication.sender-address=DoNotReply@example.invalid

logging.level.root=WARN
logging.level.com.example.skishop=DEBUG
