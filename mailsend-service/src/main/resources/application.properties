spring.application.name=mailsend-service

# Server
server.port=8089
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skishop_mailsend}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring Cloud Stream (Kafka)
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}
spring.cloud.stream.bindings.mailEventConsumer-in-0.destination=user-events
spring.cloud.stream.bindings.mailEventConsumer-in-0.group=mailsend-service
spring.cloud.stream.bindings.mailEventConsumer-in-0.content-type=application/json
spring.cloud.stream.function.definition=mailEventConsumer

# Output binding for MailSent/MailSendFailed (published via common-lib EventPublisher)
spring.cloud.stream.bindings.domainEvents-out-0.destination=mail-events
spring.cloud.stream.bindings.domainEvents-out-0.content-type=application/json

# Azure Communication Services
azure.communication.endpoint=${AZURE_COMMUNICATION_ENDPOINT:https://skishop-acs.communication.azure.com}
azure.communication.connection-string=${AZURE_COMMUNICATION_CONNECTION_STRING:}
azure.communication.sender-address=${MAIL_SENDER_ADDRESS:DoNotReply@skishop-acs.azurecomm.net}

# Mail
mail.retry.max-attempts=3
mail.retry.initial-interval-ms=30000
mail.retry.multiplier=2.0
mail.base-url=${APP_BASE_URL:http://localhost:3000}

# Service URLs
services.user-management.url=${USER_MANAGEMENT_SERVICE_URL:http://localhost:8081}

# JWT
jwt.secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# Logging
logging.level.root=WARN
logging.level.com.example.skishop=INFO

# Virtual Threads
spring.threads.virtual.enabled=true

# RFC 7807
spring.mvc.problemdetails.enabled=true

# Pageable
spring.data.web.pageable.max-page-size=100

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
