apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: skishop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: skishop-sa
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: skishop-secrets
      containers:
      - name: api-gateway-service
        image: <ACR_LOGIN_SERVER>/api-gateway-service:latest
        ports:
        - containerPort: 8090
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: skishop-secrets
              key: JWT_SECRET
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: skishop-secrets
              key: INTERNAL_API_KEY
        - name: AUTH_SERVICE_URL
          value: "http://authentication-service:8080"
        - name: USER_SERVICE_URL
          value: "http://user-management-service:8081"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-management-service:8082"
        - name: SALES_SERVICE_URL
          value: "http://sales-management-service:8083"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-cart-service:8084"
        - name: POINT_SERVICE_URL
          value: "http://point-service:8085"
        - name: COUPON_SERVICE_URL
          value: "http://coupon-service:8088"
        - name: AI_SERVICE_URL
          value: "http://ai-support-service:8087"
        - name: ORCHESTRATOR_SERVICE_URL
          value: "http://agent-runtime-monolith:8100"
        - name: MAIL_SERVICE_URL
          value: "http://mailsend-service:8089"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 8090
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8090
          initialDelaySeconds: 180
          periodSeconds: 20
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: skishop
spec:
  selector:
    app: api-gateway-service
  ports:
  - port: 8090
    targetPort: 8090
  type: ClusterIP
